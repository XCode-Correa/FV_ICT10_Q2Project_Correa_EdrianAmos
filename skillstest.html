        <h1>ELEMENT FINDER</h1>
        <p>Periodic Table Information Finder</p>

        <div>
            <form onsubmit="return false;">
                <div class="form-check">
                    <div class="form-group">
                        <input type="text" id="element1" class="input" placeholder="Element Symbol (e.g., H, He)" required>

                </div>
                
                <div class="button-contain">
                    <button type="button" py-click="check_element">CHECK ELEMENT</button>
                </div>
            </form>
            <br><br>
            <div id="result">
                <h3>Search Result</h3>
                <p><b>Symbol: <span id="symbol"> </span></b></p>
                <p><b>Element: <span id="name"> </span></b></p>
                <p><b>Atomic Number: <span id="number"> </span></b></p>
